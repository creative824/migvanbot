<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>הצעות מחיר — מגוון</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#ffffff; --ink:#17181c; --muted:#6b7280; --line:#e6e8ec;
    --green:#3d7a1f; --green-bg:#e8f3e0; --amber:#8a5a00; --amber-bg:#fff3d6;
    --blue:#1d4ed8; --blue-bg:#e3ecff; --red:#b42318; --red-bg:#fde8e6;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 2px 10px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1115; --card:#181b21; --ink:#eceef2; --muted:#98a0ae; --line:#272b33;
      --green:#8fd45f; --green-bg:#1b2a14; --amber:#f2c14e; --amber-bg:#2b2410;
      --blue:#8db0ff; --blue-bg:#17233f; --red:#ff8f85; --red-bg:#3a1714;
      --shadow:none;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.45 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  h1{font-size:21px;margin:0}
  .sub{color:var(--muted);font-size:13px}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .search{flex:1 1 240px;position:relative}
  .search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;
       background:var(--card);color:var(--ink);font-size:15px}
  .search input:focus{outline:2px solid var(--green);border-color:transparent}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;
       border-radius:999px;font-size:14px;cursor:pointer;display:flex;gap:7px;align-items:center}
  .tab b{font-weight:700}
  .tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);width:40px;height:40px;
       border-radius:12px;cursor:pointer;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);
        border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;
        border-inline-start:5px solid var(--amber)}
  .card.signed{border-inline-start-color:var(--green)}
  .card.viewed{border-inline-start-color:var(--blue)}
  .card header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .card h3{margin:0;font-size:17px;line-height:1.25;word-break:break-word}
  .meta{color:var(--muted);font-size:13px;margin-top:3px}
  .badge{white-space:nowrap;font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px}
  .b-signed{background:var(--green-bg);color:var(--green)}
  .b-pending{background:var(--amber-bg);color:var(--amber)}
  .b-viewed{background:var(--blue-bg);color:var(--blue)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-size:13px}
  dl.times{margin:0;display:grid;gap:4px;font-size:13.5px}
  dl.times div{display:flex;gap:8px}
  dl.times dt{color:var(--muted);min-width:56px}
  dl.times dd{margin:0}
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:10px;
       font-size:13.5px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.wa{color:#128c4a;border-color:#128c4a55}
  .btn.del{color:var(--red);border-color:#b4231855;margin-inline-start:auto}
  .btn.del:hover{background:var(--red-bg)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:70px 10px}
  .empty .big{font-size:42px}
  .toast{position:fixed;inset-inline:0;bottom:22px;margin:auto;width:max-content;max-width:90vw;
       background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;
       opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .fade{opacity:0;transform:scale(.97);transition:.28s}
  @media (max-width:560px){.grid{grid-template-columns:1fr}.top h1{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>📋 הצעות מחיר</h1>
      <div class="sub" id="upd">טוען…</div>
    </div>
    <button class="iconbtn" id="refresh" title="רענון">⟳</button>
  </div>

  <div class="tools">
    <div class="search"><input id="q" type="search" placeholder="חיפוש לפי שם עסק, ח.פ או שם החותם…" autocomplete="off"></div>
    <div class="tabs" id="tabs">
      <button class="tab on" data-s="all">הכל <b id="c-all">0</b></button>
      <button class="tab" data-s="pending">⏳ ממתינות <b id="c-pending">0</b></button>
      <button class="tab" data-s="signed">✅ נחתמו <b id="c-signed">0</b></button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=s=>document.querySelector(s);
const state={status:'all',q:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=ts=>ts?new Date(ts*1000).toLocaleString('he-IL',{timeZone:'Asia/Jerusalem',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const money=n=>'₪'+Number(n||0).toLocaleString('he-IL',{maximumFractionDigits:2});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200);}

function card(r){
  const st=r.status==='signed'?'signed':(r.viewed_at?'viewed':'pending');
  const badge={signed:'<span class="badge b-signed">✅ נחתמה</span>',
               viewed:'<span class="badge b-viewed">👀 נפתחה · ממתינה</span>',
               pending:'<span class="badge b-pending">⏳ ממתינה לחתימה</span>'}[st];
  const chips=[
    `${money(r.monthly_price)} לחודש לנגן`,`התקנה ${money(r.install_price)}`,
    `${r.qty} ${r.qty===1?'נגן':'נגנים'}`,
    r.rights_free?'ללא זכויות':'מוזיקה רגילה'
  ];
  if(r.broadcasts) chips.push(`תשדירים ${r.broadcasts} בחודש`);
  if(r.qty>1) chips.push(`סה"כ חודשי ${money(r.monthly_price*r.qty)}`);
  const waText=encodeURIComponent(`הצעת מחיר עבור ${r.business_name}\nלצפייה ולאישור: ${r.link}`);
  const times=`<div><dt>הופקה</dt><dd>${fmtDate(r.created_at)}</dd></div>`+
    (r.viewed_at?`<div><dt>נפתחה</dt><dd>${fmtDate(r.viewed_at)}</dd></div>`:'')+
    (r.status==='signed'?`<div><dt>נחתמה</dt><dd>${fmtDate(r.signed_at)} · ${esc(r.signer)}</dd></div>`:'');
  return `<article class="card ${st}" data-id="${r.id}">
    <header><div><h3>${esc(r.business_name)}</h3>
      <div class="meta">#${r.id}${r.company_id?` · ח.פ ${esc(r.company_id)}`:''}</div></div>${badge}</header>
    <div class="chips">${chips.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
    <dl class="times">${times}</dl>
    <footer class="actions">
      ${r.has_pdf?`<a class="btn" href="/admin/pdf/${r.id}" target="_blank">📄 PDF</a>`:''}
      ${r.has_signed?`<a class="btn primary" href="/admin/pdf/${r.id}?signed=1" target="_blank">✍️ PDF חתום</a>`:''}
      ${r.status!=='signed'?`<button class="btn" data-act="copy" data-link="${esc(r.link)}">🔗 העתק קישור</button>
        <a class="btn wa" href="https://wa.me/?text=${waText}" target="_blank" rel="noopener">📲 וואטסאפ</a>`:''}
      <button class="btn del" data-act="del" data-id="${r.id}" data-name="${esc(r.business_name)}" data-signed="${r.status==='signed'?1:0}">🗑 מחק</button>
    </footer></article>`;
}

async function load(){
  const p=new URLSearchParams();
  if(state.status!=='all')p.set('status',state.status);
  if(state.q)p.set('q',state.q);
  let r;
  try{ r=await fetch('/admin/api/quotes?'+p,{headers:{'X-Admin':'1'}}); }
  catch(e){ $('#upd').textContent='אין חיבור לשרת'; return; }
  if(r.status===401){ location.reload(); return; }
  const j=await r.json();
  $('#c-all').textContent=j.counts.total;
  $('#c-pending').textContent=j.counts.pending;
  $('#c-signed').textContent=j.counts.signed;
  $('#grid').innerHTML=j.quotes.length?j.quotes.map(card).join(''):
    `<div class="empty"><div class="big">🗂️</div><p>${state.q||state.status!=='all'?'לא נמצאו הצעות מתאימות':'עדיין אין הצעות. הפק הצעה ראשונה בבוט בטלגרם.'}</p></div>`;
  $('#upd').textContent='עודכן '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})+' · '+j.counts.total+' הצעות';
}

$('#tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab'); if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===b));
  state.status=b.dataset.s; load();
});
let qt; $('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{state.q=e.target.value.trim();load();},250);});
$('#refresh').onclick=()=>{load();toast('מרענן…');};

$('#grid').addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  if(b.dataset.act==='copy'){
    try{ await navigator.clipboard.writeText(b.dataset.link); toast('הקישור הועתק ✓'); }
    catch(_){ prompt('העתק את הקישור:',b.dataset.link); }
  }
  if(b.dataset.act==='del'){
    const signed=b.dataset.signed==='1';
    const msg=`למחוק את ההצעה של "${b.dataset.name}" (#${b.dataset.id})?`+
      (signed?'\n\n⚠️ ההצעה חתומה. המחיקה סופית ותמחק גם את הקובץ החתום.':'\n\nהמחיקה סופית.');
    if(!confirm(msg)) return;
    const r=await fetch('/admin/api/delete/'+b.dataset.id,{method:'POST',headers:{'X-Admin':'1'}});
    if(r.ok){
      const el=b.closest('.card'); el.classList.add('fade'); setTimeout(()=>{el.remove();load();},280);
      toast('ההצעה נמחקה');
    } else toast('המחיקה נכשלה');
  }
});

load();
setInterval(()=>{ if(document.activeElement!==$('#q') && !document.hidden) load(); },30000);
</script>
</body>
</html>
